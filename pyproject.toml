[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ux-transcribe"
version = "0.1.0"
description = "Skill et outils CLI de transcription de démos et interviews UX en Markdown exploitable"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Vincent Perrery" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Software Development :: Documentation"
]

dependencies = [
  "typer>=0.9.0",
  "rich>=13.0.0",
  "pyyaml>=6.0",
  "webvtt-py>=0.4.6",
  "pillow>=10.0.0",
  "imagehash>=4.3.1"
]

[project.optional-dependencies]
ml = [
  "faster-whisper>=1.0.0",
  "torch>=2.0.0",
  "torchaudio>=2.0.0",
  "pyannote.audio>=3.1.0"
]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0"
]

[project.scripts]
ux-transcribe = "ux_transcribe.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
